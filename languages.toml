# ---------------------------------------------------------------------------
# Tier 2 — declarative tags.scm (`handler = "queries"`, rgctl-lang-runtime)
# ---------------------------------------------------------------------------

[languages.zig]
handler = "queries"
plugin = "QueryLanguagePlugin"
module = "rgctl_lang_zig"
crate = "tree-sitter-zig"
extensions = ["zig", "zon"]
aliases = ["zig"]
function_kinds = ["function_declaration"]
class_kinds = ["struct_declaration"]
import_kinds = []
enable_complexity = false
enable_type_inference = false
tags_scm = "crates/rgctl-lang-zig/queries/tags.scm"

