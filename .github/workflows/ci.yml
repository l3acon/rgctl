# Triggers:
#   - workflow_dispatch  — full suite manually from the Actions tab (any branch/ref).
#   - pull_request       — always runs the cheap no-AI-commit-trailer gate on the PR
#                         commit range. Full `cargo check` / format / lint / test suite
#                         only when a maintainer adds the `ci` label (create that label
#                         in the repo if missing) or triggers `workflow_dispatch`.
#
# Fork PRs: label must be added by a maintainer on the base-repo PR.
name: CI

on:
  workflow_dispatch:
    inputs:
      features:
        description: Optional Cargo features (e.g. proc-macros)
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fail the build on grammar ↔ *-ast-coverage.json drift (rgctl-languages build.rs).
  RGCTL_AST_COVERAGE_STRICT: "1"
  FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.features || '' }}

jobs:
  # Block PR commits that advertise AI agent co-authorship / assistance trailers
  # (Cursor, Claude, Copilot, …). Gated behind maintainer `ci` label so no Actions run on unapproved PRs.
  no-ai-commit-trailers:
    name: no AI commit trailers
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR commits for AI agent trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check-no-ai-commit-trailers.py \
            --range "${BASE_SHA}..${HEAD_SHA}"

  # Cold-compile gate (gated behind maintainer `ci` label, same as the full suite).
  check:
    name: cargo check (default features)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: check-default

      - name: cargo check --bin rgctl
        run: cargo check --locked --bin rgctl

  ci:
    name: Format, lint, and test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ env.FEATURES }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --features "${{ env.FEATURES }}" --lib --bins -- -D warnings

      - name: cargo clippy (rgctl-analysis)
        run: cargo clippy -p rgctl-analysis --features "${{ env.FEATURES }}" -- -D warnings

      - name: cargo clippy (rgctl-graph, rgctl-core)
        run: cargo clippy -p rgctl-graph -p rgctl-core --features "${{ env.FEATURES }}" -- -D warnings

      - name: cargo test (unit and integration)
        run: cargo test --features "${{ env.FEATURES }}" --workspace --lib --bins --tests

      - name: QE map collisions
        run: cargo test --features "${{ env.FEATURES }}" --test map_collision_qe

      - name: QE graph correctness
        run: cargo test --features "${{ env.FEATURES }}" --test graph_correctness

      - name: QE semantic search
        run: cargo test --features "${{ env.FEATURES }}" --test semantic_search_qe

      - name: QE cross-feature consistency
        run: cargo test --features "${{ env.FEATURES }}" --test cross_feature_qe

      - name: QE graph determinism
        run: |
          cargo test --features "${{ env.FEATURES }}" --test graph_determinism_qe
          echo '{"gate":"graph_determinism_qe","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: QE stable-key invariance
        run: cargo test --features "${{ env.FEATURES }}" --test stable_key_invariance_qe

      - name: QE columnar zero cold-touch
        run: |
          cargo test --features "${{ env.FEATURES }}" --test columnar_zero_cold_touch_gate
          echo '{"gate":"columnar_zero_cold_touch_gate","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: E2E workflow equivalence
        run: cargo test --features "${{ env.FEATURES }}" --test e2e_workflow_equivalence

      - name: E2E feature contracts
        run: cargo test --features "${{ env.FEATURES }}" --test e2e_feature_contracts

      - name: CLI JSON contract (unit)
        run: cargo test --features "${{ env.FEATURES }}" --test cli_output

      - name: CLI subprocess golden paths
        run: cargo test --release --features "${{ env.FEATURES }}" --test subprocess_golden_path

      - name: CLI all-commands sanity
        run: cargo test --release --features "${{ env.FEATURES }}" --test all_commands_sanity

      - name: Blast-radius performance gates (release)
        run: cargo test --release --features "${{ env.FEATURES }}" --test blast_radius_perf

      - name: Scale perf CI gate (release)
        run: |
          cargo test --release --features "${{ env.FEATURES }}" --test scale_perf_ci_gate -- --nocapture
          echo '{"gate":"scale_perf_ci_gate","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: Fast-Leiden 150K & Centrality Scale Gates (release)
        run: |
          cargo test --release --features "${{ env.FEATURES }}" --test community_audit --test centrality_audit --test centrality_approx_scale -- --nocapture
          echo '{"gate":"centrality_scale","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: Benchmark Compilation & Smoke Gate
        run: |
          cargo bench --no-run
          echo '{"gate":"bench_smoke","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: AST Handler Runtime Coverage Gate (RGCTL_AST_COVERAGE_TRACK=1)
        env:
          RGCTL_AST_COVERAGE_TRACK: "1"
        run: |
          cargo test --features "${{ env.FEATURES }}" \
            -p rgctl-ast-coverage \
            -p rgctl-languages \
            -p rgctl-lang-c \
            -p rgctl-lang-cpp \
            -p rgctl-lang-csharp \
            -p rgctl-lang-go \
            -p rgctl-lang-java \
            -p rgctl-lang-javascript \
            -p rgctl-lang-kotlin \
            -p rgctl-lang-php \
            -p rgctl-lang-python \
            -p rgctl-lang-ruby \
            -p rgctl-lang-rust \
            -p rgctl-lang-typescript \
            --tests
          echo '{"gate":"ast_coverage","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: Single-Pass Complexity Parity
        run: cargo test --features "${{ env.FEATURES }}" -p rgctl-extraction --test single_pass_complexity_parity

      - name: Cross-Language MRO, Overrides & DI Correctness
        run: |
          cargo test --features "${{ env.FEATURES }}" --test inheritance_edges --test cross_language_mro_and_di
          echo '{"gate":"cross_language_mro_and_di","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: CFG/PDG v3 TOC, Lazy Slicing & Shadowing Correctness
        run: |
          cargo test --features "${{ env.FEATURES }}" --test slicing --test taint_analysis
          echo '{"gate":"slicing","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: Fast-Leiden Connectivity & Centrality NodeRole Audit
        run: |
          cargo test --features "${{ env.FEATURES }}" --test community_audit --test centrality_audit
          echo '{"gate":"community_audit","status":"PASS"}' >> .rgctl-ci-gate-status.jsonl

      - name: Incremental FactsCache & Updater Equivalence
        run: cargo test --features "${{ env.FEATURES }}" --test incremental_performance_integration

      - name: Generate CI Gate Summary
        if: always()
        run: python3 scripts/generate-ci-gate-summary.py

      - name: Upload CI Gate Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgctl-ci-gate-report
          path: .rgctl-ci-gate-report.json
          if-no-files-found: ignore