# Legacy GitHub Pages site (sshaaf.dev/rgctl/, shaaf.dev/rgctl/, *.github.io/rgctl/) → redirect stub to https://rgctl.io/
#
# Full site + guides: https://github.com/rgctl/rgctl-website

name: Website

on:
  push:
    branches: [main, docs]
    paths:
      - "website/**"
      - "scripts/install.sh"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage redirect site
        run: |
          mkdir -p _pages
          touch _pages/.nojekyll
          cp website/index.html website/404.html _pages/
          cp scripts/install.sh _pages/install.sh
          # Keep llms.txt pointing at the new host
          printf '%s\n' \
            '# rgctl' \
            '' \
            '> Code knowledge graph for LLM agents.' \
            '' \
            'Website: https://rgctl.io/' \
            'Repository: https://github.com/rgctl/rgctl' \
            'Install: `curl -fsSL https://rgctl.io/install.sh | sh`' \
            > _pages/llms.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
