[package]
name = "rgctl-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Security analysis for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-analysis = { path = "../rgctl-analysis" }
rgctl-error = { path = "../rgctl-error" }
rgctl-extraction = { path = "../rgctl-extraction" }
rgctl-graph = { path = "../rgctl-graph" }
osv = { workspace = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
