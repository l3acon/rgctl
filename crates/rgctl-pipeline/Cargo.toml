[package]
name = "rgctl-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Parallel processing pipeline for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-error = { path = "../rgctl-error" }
rgctl-extraction = { path = "../rgctl-extraction" }
rgctl-graph = { path = "../rgctl-graph" }
rgctl-registry = { path = "../rgctl-registry" }
indicatif = "0.17"
rayon = "1.7"
crossbeam = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
rgctl-languages = { workspace = true }
