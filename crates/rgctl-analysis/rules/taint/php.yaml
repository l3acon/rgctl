schema_version: 1
id: php-builtins
languages:
- php
rules:
- id: php-src-http
  role: source
  kind: HttpParameter
  match:
    type: any_substring
    values:
    - $_GET
    - $_POST
    - $_REQUEST
    - $_COOKIE
    - $_SERVER
    - $_FILES
    - 'php://input'
    - filter_input(
    - filter_input_array(
- id: php-src-file
  role: source
  kind: FileInput
  match:
    type: any_substring
    values:
    - file_get_contents(
    - fgets(
    - readfile(
    - fopen(
- id: php-sink-sql
  role: sink
  kind: SqlQuery
  cwe: CWE-89
  match:
    type: any_substring
    values:
    - mysqli_query(
    - mysql_query(
    - '->query('
    - '->exec('
- id: php-sink-shell
  role: sink
  kind: ShellCommand
  cwe: CWE-78
  match:
    type: any_substring
    values:
    - exec(
    - shell_exec(
    - system(
    - passthru(
    - proc_open(
- id: php-sink-eval
  role: sink
  kind: CodeEval
  match:
    type: any_substring
    values:
    - eval(
    - assert(
- id: php-sink-include
  role: sink
  kind: FileWrite
  match:
    type: any_substring
    values:
    - include(
    - require(
    - include_once(
    - require_once(
- id: php-sink-unser
  role: sink
  kind: CodeEval
  match:
    type: substring
    value: unserialize(
- id: php-sink-html
  role: sink
  kind: HtmlRender
  cwe: CWE-79
  match:
    type: any_substring
    values:
    - 'echo '
    - 'print '
- id: php-san-html
  role: sanitizer
  kind: HtmlEscape
  match:
    type: any_substring
    values:
    - htmlspecialchars(
    - filter_var(
- id: php-san-sql
  role: sanitizer
  kind: SqlParameterize
  match:
    type: any_substring
    values:
    - mysqli_real_escape_string(
    - '->prepare('
