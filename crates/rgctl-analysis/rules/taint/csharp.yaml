schema_version: 1
id: csharp-builtins
languages:
- csharp
rules:
- id: cs-src-http
  role: source
  kind: HttpParameter
  match:
    type: any_substring
    values:
    - Request.Query
    - Request.Form
    - Request.Headers
    - '[FromQuery]'
    - '[FromBody]'
    - HttpContext.Request
- id: cs-src-file
  role: source
  kind: FileInput
  match:
    type: any_substring
    values:
    - File.ReadAllText
    - File.ReadAllBytes
    - StreamReader
- id: cs-src-env
  role: source
  kind: EnvironmentVar
  match:
    type: substring
    value: Environment.GetEnvironmentVariable
- id: cs-src-argv
  role: source
  kind: CommandLineArg
  match:
    type: any_substring
    values:
    - 'args['
    - Environment.GetCommandLineArgs
- id: cs-src-db
  role: source
  kind: DatabaseResult
  match:
    type: any_substring
    values:
    - ExecuteReader
    - SqlDataReader
- id: cs-sink-sql
  role: sink
  kind: SqlQuery
  cwe: CWE-89
  match:
    type: any_substring
    values:
    - ExecuteSqlRaw
    - ExecuteSqlInterpolated
    - FromSqlRaw
    - SqlCommand
    - ExecuteNonQuery
    - ExecuteReader
- id: cs-sink-shell
  role: sink
  kind: ShellCommand
  cwe: CWE-78
  match:
    type: any_substring
    values:
    - Process.Start
    - ProcessStartInfo
- id: cs-sink-file
  role: sink
  kind: FileWrite
  match:
    type: any_substring
    values:
    - File.WriteAllText
    - File.WriteAllBytes
    - StreamWriter
- id: cs-sink-html
  role: sink
  kind: HtmlRender
  cwe: CWE-79
  match:
    type: any_substring
    values:
    - Response.Write
    - Html.Raw
    - InnerHtml
- id: cs-sink-log
  role: sink
  kind: LogOutput
  match:
    type: any_substring
    values:
    - Log.
    - Logger.
    - Console.WriteLine
- id: cs-san-num
  role: sanitizer
  kind: TypeCast
  detail: numeric
  match:
    type: any_substring
    values:
    - int.Parse
    - long.Parse
    - double.Parse
- id: cs-san-html
  role: sanitizer
  kind: HtmlEscape
  match:
    type: any_substring
    values:
    - HtmlEncode
    - WebUtility.HtmlEncode
    - AntiXss
- id: cs-san-sql
  role: sanitizer
  kind: SqlParameterize
  match:
    type: any_substring
    values:
    - AddWithValue
    - Parameters.Add
