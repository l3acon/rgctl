schema_version: 1
id: javascript-builtins
languages:
- javascript
- typescript
rules:
- id: js-src-http
  role: source
  kind: HttpParameter
  match:
    type: any_substring
    values:
    - req.query
    - req.body
    - req.params
- id: js-src-file
  role: source
  kind: FileInput
  match:
    type: substring
    value: fs.readFile
- id: js-src-argv
  role: source
  kind: CommandLineArg
  match:
    type: substring
    value: process.argv
- id: js-src-env
  role: source
  kind: EnvironmentVar
  match:
    type: substring
    value: process.env
- id: js-sink-sql
  role: sink
  kind: SqlQuery
  cwe: CWE-89
  match:
    type: any_substring
    values:
    - .query(
    - .execute(
- id: js-sink-shell
  role: sink
  kind: ShellCommand
  cwe: CWE-78
  match:
    type: any_substring
    values:
    - exec(
    - spawn(
- id: js-sink-eval
  role: sink
  kind: CodeEval
  match:
    type: any_substring
    values:
    - eval(
    - Function(
- id: js-sink-html
  role: sink
  kind: HtmlRender
  cwe: CWE-79
  match:
    type: any_substring
    values:
    - innerHTML
    - document.write
- id: js-san-num
  role: sanitizer
  kind: TypeCast
  detail: numeric
  match:
    type: any_substring
    values:
    - parseInt(
    - parseFloat(
- id: js-san-html
  role: sanitizer
  kind: HtmlEscape
  match:
    type: any_substring
    values:
    - escapeHtml(
    - sanitize(
