schema_version: 1
id: c-builtins
languages:
- c
rules:
- id: c-src-http
  role: source
  kind: HttpParameter
  match:
    type: any_substring
    values:
    - getenv(
    - getenv_s(
    - getchar(
    - fgets(
    - read(
    - recv(
    - QUERY_STRING
- id: c-src-file
  role: source
  kind: FileInput
  match:
    type: any_substring
    values:
    - fread(
    - fopen(
- id: c-src-argv
  role: source
  kind: CommandLineArg
  match:
    type: substring
    value: 'argv['
- id: c-sink-sql-api
  role: sink
  kind: SqlQuery
  cwe: CWE-89
  match:
    type: any_substring
    values:
    - sqlite3_exec(
    - mysql_query(
    - PQexec(
- id: c-sink-sql-sprintf
  role: sink
  kind: SqlQuery
  cwe: CWE-89
  match:
    type: all_of
    of:
    - type: any_substring
      values:
      - sprintf(
      - snprintf(
    - type: any_substring
      values:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
- id: c-sink-shell
  role: sink
  kind: ShellCommand
  cwe: CWE-78
  match:
    type: any_substring
    values:
    - system(
    - popen(
- id: c-sink-html-fprintf
  role: sink
  kind: HtmlRender
  cwe: CWE-79
  match:
    type: substring
    value: fprintf(
- id: c-sink-html-printf
  role: sink
  kind: HtmlRender
  cwe: CWE-79
  match:
    type: substring
    value: printf(
    unless_any:
    - sprintf(
    - snprintf(
- id: c-sink-file
  role: sink
  kind: FileWrite
  match:
    type: substring
    value: fwrite(
- id: c-san-num
  role: sanitizer
  kind: TypeCast
  detail: numeric
  match:
    type: any_substring
    values:
    - atoi(
    - strtol(
    - strtoul(
- id: c-san-sql
  role: sanitizer
  kind: SqlParameterize
  match:
    type: all_substrings
    values:
    - snprintf(
    - '%'
