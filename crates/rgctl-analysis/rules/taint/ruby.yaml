schema_version: 1
id: ruby-builtins
languages:
- ruby
rules:
- id: rb-src-http
  role: source
  kind: HttpParameter
  match:
    type: any_substring
    values:
    - 'params['
    - request.
    - 'cookies['
    - 'ENV['
    - ARGV
- id: rb-src-file
  role: source
  kind: FileInput
  match:
    type: any_substring
    values:
    - File.read
    - IO.read
    - gets
- id: rb-sink-shell
  role: sink
  kind: ShellCommand
  cwe: CWE-78
  match:
    type: any_substring
    values:
    - system(
    - Open3
    - exec(
    - '`'
    - '%x{'
- id: rb-sink-eval
  role: sink
  kind: CodeEval
  match:
    type: any_substring
    values:
    - eval(
    - instance_eval
    - class_eval
- id: rb-sink-sql
  role: sink
  kind: SqlQuery
  cwe: CWE-89
  match:
    type: any_substring
    values:
    - execute(
    - where(
    - .execute(
- id: rb-sink-html
  role: sink
  kind: HtmlRender
  cwe: CWE-79
  match:
    type: substring
    value: render
- id: rb-san-html
  role: sanitizer
  kind: HtmlEscape
  match:
    type: any_substring
    values:
    - CGI.escapeHTML
    - 'ERB::Util.html_escape'
