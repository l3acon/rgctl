[package]
name = "rgctl-languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in Tier 1 language plugins for rgctl"
license = "MIT OR Apache-2.0"

[dependencies]
rgctl-registry = { workspace = true }
rgctl-config-formats = { workspace = true }
rgctl-ast-coverage = { workspace = true }
rgctl-lang-rust = { workspace = true }
rgctl-lang-python = { workspace = true }
rgctl-lang-javascript = { workspace = true }
rgctl-lang-typescript = { workspace = true }
rgctl-lang-go = { workspace = true }
rgctl-lang-java = { workspace = true }
rgctl-lang-csharp = { workspace = true }
rgctl-lang-c = { workspace = true }
rgctl-lang-cpp = { workspace = true }
rgctl-lang-markdown = { workspace = true }
rgctl-lang-php = { workspace = true }
rgctl-lang-ruby = { workspace = true }
rgctl-lang-puppet = { workspace = true }
rgctl-lang-erb = { workspace = true }
rgctl-lang-kotlin = { workspace = true }
rgctl-lang-groovy = { workspace = true }
rgctl-lang-swift = { workspace = true }
rgctl-lang-scala = { workspace = true }
rgctl-lang-dart = { workspace = true }
rgctl-lang-elixir = { workspace = true }
rgctl-lang-lua = { workspace = true }
rgctl-lang-bash = { workspace = true }
rgctl-lang-sql = { workspace = true }
rgctl-lang-hcl = { workspace = true }
rgctl-lang-zig = { workspace = true }
rgctl-lang-nix = { workspace = true }
rgctl-lang-proto = { workspace = true }
rgctl-lang-solidity = { workspace = true }
rgctl-lang-ocaml = { workspace = true }
rgctl-lang-clojure = { workspace = true }
rgctl-lang-objc = { workspace = true }
rgctl-lang-verilog = { workspace = true }
rgctl-lang-fortran = { workspace = true }
rgctl-lang-gdscript = { workspace = true }
rgctl-lang-haskell = { workspace = true }
rgctl-lang-r = { workspace = true }
rgctl-lang-julia = { workspace = true }
# JSON/YAML: optional Tier-2 query crates exist but are not dual-registered
# (config-format plugins own `.json` / `.yaml` ingest).

[build-dependencies]
rgctl-ast-coverage = { workspace = true }

[[bench]]
name = "single_pass_vs_baseline"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rgctl-plugin-api = { workspace = true }
